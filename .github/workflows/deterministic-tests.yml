name: Deterministic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and adapter dependencies
        run: python -m pip install -e '.[dev,calendar,mcp]'
      - name: Require MCP dependencies (no silent optional-module skip)
        run: python -c "import mcp; import requests; import google_auth_oauthlib"
      - name: Run deterministic suite (no Google or model inference)
        run: python -m pytest -q -ra
