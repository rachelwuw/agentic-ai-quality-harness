[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rachel-agentic-quality-harness"
version = "0.2.0.dev0"
description = "A small local-model agent and quality harness"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
mcp = ["mcp>=1.12,<2", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
calendar = ["google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
